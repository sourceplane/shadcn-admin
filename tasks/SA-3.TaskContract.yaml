apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: SA-3
  title: "shadcn-admin becomes an Orun baseline"
spec:
  goal: blueprint.yaml and repo-blueprint.yaml take a new admin dashboard from nothing to live on stage and prod in one landing, held by Baseline CI
  affects:
    - blueprint.yaml
    - repo-blueprint.yaml
    - BOOTSTRAP.md
    - .baseline
    - .github/workflows/baseline.yml
    - .github/workflows/tag.yml
    - ai/context
    - docs/phases
    - hooks
    - testing
    - tooling/rebrand
    - tooling/bootstrap
    - tooling/catalog
    - apps/web/docs
    - tests/web/docs
    - specs/epics/shadcn-admin
    - README.md
  doneWhen:
    - every Baseline CI tier is green
    - a site placed from it carries the site only, branded, with the template's credit intact
  gates: []
